# Nginx reverse proxy para el backend de Alimentia — corre NATIVO en el EC2
# (no dentro de un contenedor). Termina TLS y reenvía todo a la app, que
# escucha en 127.0.0.1:3001 (ver docker-compose.prod.yml).
#
# Instalación y emisión del certificado: ver README.md, sección
# "Despliegue en EC2 (Ubuntu 24.04)".
#
# Reemplaza <EC2_PUBLIC_DNS> por el DNS público que AWS asignó a la
# instancia, p. ej. ec2-3-84-12-34.compute-1.amazonaws.com (Consola EC2 >
# tu instancia > "Public IPv4 DNS"). Cuando llegue el dominio propio, cambia
# server_name aquí y vuelve a correr certbot --nginx -d tu-dominio-real.

server {
    listen 80;
    listen [::]:80;
    server_name <EC2_PUBLIC_DNS>;

    # Certbot (modo --nginx) reescribe este bloque para agregar el
    # redirect a HTTPS y el bloque `listen 443 ssl` de abajo. Antes de
    # correr certbot, este server{} en :80 es el único que existe.

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Swagger/websockets no se usan hoy, pero no cuesta dejarlo listo
        # para upgrade de conexión si hiciera falta más adelante.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Los archivos (adjuntos, PDFs) no pasan por este backend: el front sube
    # directo a S3 vía URL prefirmada (ver README, "Almacenamiento de
    # archivos"). El límite de abajo cubre payloads JSON normales.
    client_max_body_size 10m;
}
